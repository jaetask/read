<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="100%" style="max-width:840px;height:auto" role="img" aria-label="A turn: a file to open opens it, a reading command moves the reader, both without a model; anything else goes to the agent, which answers from the open file."><style>
svg { --paper:#fff; --ink:#0a0a0a; --muted:#525252; --accent:#0000ff; --tint:rgba(0,0,255,.05); --fill:rgba(10,10,10,.05); --line:rgba(10,10,10,.3);
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif }
@media (prefers-color-scheme: dark) { svg { --paper:#0d0d10; --ink:#f2f2f2; --muted:#a3a3a3; --accent:#8894ff; --tint:rgba(136,148,255,.12); --fill:rgba(255,255,255,.06); --line:rgba(255,255,255,.3) } }
.bg { fill: var(--paper) }
.n { fill: var(--paper); stroke: var(--ink) } .s { fill: var(--fill); stroke: var(--line) }
.f { fill: var(--tint); stroke: var(--accent); stroke-width: 1.2 } .o { fill: var(--paper); stroke: var(--ink); stroke-dasharray: 5 4 }
.t { fill: var(--ink) } .m { fill: var(--muted) } .a { fill: var(--accent) }
.e { stroke: var(--ink); stroke-width: 1.2; fill: none } .ea { stroke: var(--accent); stroke-width: 1.4; fill: none }
.hm { fill: var(--ink) } .ham { fill: var(--accent) }
</style><defs>
<marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="hm"/></marker>
<marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ham"/></marker>
</defs><rect class="bg" x="0" y="0" width="840" height="330"/><rect x="20" y="20" width="220" height="54" rx="6" class="n"/><text x="32" y="45" class="t" font-size="13" font-weight="700" text-anchor="start">Said or typed</text><text x="32" y="62" class="m" font-size="11" font-weight="400" text-anchor="start">one turn</text><path d="M130,68 L130,96" class="e" marker-end="url(#h)"/><rect x="20" y="100" width="220" height="54" rx="6" class="n"/><text x="32" y="125" class="t" font-size="13" font-weight="700" text-anchor="start">Names a file to open?</text><text x="32" y="142" class="m" font-size="11" font-weight="400" text-anchor="start">parseOpen</text><path d="M240,124 L300,124" class="e" marker-end="url(#h)"/><text x="270" y="116" class="m" font-size="10" font-weight="700" text-anchor="middle">yes</text><rect x="304" y="100" width="230" height="54" rx="6" class="f"/><text x="316" y="125" class="a" font-size="13" font-weight="700" text-anchor="start">Opens it</text><text x="316" y="142" class="m" font-size="11" font-weight="400" text-anchor="start">reader-open, no model</text><path d="M130,148 L130,176" class="e" marker-end="url(#h)"/><text x="138" y="168" class="m" font-size="10" font-weight="700" text-anchor="start">no</text><rect x="20" y="180" width="220" height="54" rx="6" class="n"/><text x="32" y="205" class="t" font-size="13" font-weight="700" text-anchor="start">A reading command?</text><text x="32" y="222" class="m" font-size="11" font-weight="400" text-anchor="start">parseCommand</text><path d="M240,204 L300,204" class="e" marker-end="url(#h)"/><text x="270" y="196" class="m" font-size="10" font-weight="700" text-anchor="middle">yes</text><rect x="304" y="180" width="230" height="54" rx="6" class="f"/><text x="316" y="205" class="a" font-size="13" font-weight="700" text-anchor="start">Moves the reader</text><text x="316" y="222" class="m" font-size="11" font-weight="400" text-anchor="start">pause, next, go to: no model</text><path d="M130,228 L130,256" class="e" marker-end="url(#h)"/><text x="138" y="248" class="m" font-size="10" font-weight="700" text-anchor="start">no</text><rect x="20" y="260" width="220" height="54" rx="6" class="n"/><text x="32" y="285" class="t" font-size="13" font-weight="700" text-anchor="start">The agent answers</text><text x="32" y="302" class="m" font-size="11" font-weight="400" text-anchor="start">from the open file</text><path d="M240,284 L300,284" class="e" marker-end="url(#h)"/><rect x="304" y="260" width="230" height="54" rx="6" class="f"/><text x="316" y="285" class="a" font-size="13" font-weight="700" text-anchor="start">Spoken as it is written</text><text x="316" y="302" class="m" font-size="11" font-weight="400" text-anchor="start">reading waits for the reply</text><rect x="570" y="100" width="250" height="208" rx="6" class="s"/><text x="582" y="125" class="a" font-size="13" font-weight="700" text-anchor="start">Worked example</text><text x="582" y="142" class="m" font-size="11" font-weight="400" text-anchor="start">From the expect tests</text><text x="582" y="159" class="t" font-size="11" font-weight="700" text-anchor="start">&quot;read number six&quot;</text><text x="582" y="176" class="m" font-size="11" font-weight="400" text-anchor="start">Reading 6. Interfaces</text><text x="582" y="193" class="t" font-size="11" font-weight="700" text-anchor="start">&quot;jump to overview&quot;</text><text x="582" y="210" class="m" font-size="11" font-weight="400" text-anchor="start">Did you mean Overview under The</text><text x="582" y="227" class="m" font-size="11" font-weight="400" text-anchor="start">planner, or under Requirements?</text><text x="582" y="244" class="t" font-size="11" font-weight="700" text-anchor="start">&quot;what does section six say about</text><text x="582" y="261" class="t" font-size="11" font-weight="700" text-anchor="start">Slack?&quot;</text><text x="582" y="278" class="m" font-size="11" font-weight="400" text-anchor="start">goes to the agent</text></svg>