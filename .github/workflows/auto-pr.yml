name: auto-pr
on:
  push:
    branches-ignore: [main]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  auto-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Open a pull request to main and merge it when ci passes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          TITLE: ${{ github.event.head_commit.message }}
        run: |
          set -e
          open=$(gh pr list -R "$REPO" --head "$BRANCH" --base main --state open --json number -q '.[0].number')
          if [ -z "$open" ]; then
            gh pr create -R "$REPO" --base main --head "$BRANCH" \
              --title "$(printf '%s\n' "$TITLE" | head -n 1)" \
              --body "Opened by auto-pr when \`$BRANCH\` was pushed. It merges itself when the ci check passes."
          fi
          gh pr merge -R "$REPO" "$BRANCH" --auto --rebase
      - name: Delete the branch once it has merged
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          while true; do
            state=$(gh pr view -R "$REPO" "$BRANCH" --json state -q .state)
            case "$state" in
              MERGED) gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" && echo "Deleted $BRANCH." && exit 0 ;;
              CLOSED) echo "Closed without merging; keeping $BRANCH." && exit 0 ;;
            esac
            sleep 15
          done
